<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" aria-labelledby="t d">
<title id="t">Minh họa isometric các tính năng SOS NOW</title>
<desc id="d">Điện thoại SOS NOW nằm giữa, quanh là 5 trạm isometric nối bằng đường nét đứt: AI Voice hướng dẫn, SOS gọi 115, định vị vị trí, tìm bệnh viện, được hỗ trợ. Mỗi trạm lần lượt sáng lên và màn hình điện thoại đổi chú thích theo, vòng lặp 10 giây.</desc>
<style>
.th{font:600 14px 'Be Vietnam Pro',Arial,sans-serif}
.ts{font:400 12px 'Be Vietnam Pro',Arial,sans-serif}
.st{animation:hl 10s infinite;transform-box:fill-box;transform-origin:center}
@keyframes hl{0%,17%{opacity:1;transform:translateY(-8px)}21%,96%{opacity:.38;transform:translateY(0)}100%{opacity:1;transform:translateY(-8px)}}
.sp{animation:sp 10s infinite}
@keyframes sp{0%,17%{opacity:1}21%,96%{opacity:.15}100%{opacity:1}}
.lb{animation:lb 10s infinite}
@keyframes lb{0%,17%{opacity:1}21%,96%{opacity:.45}100%{opacity:1}}
.cap{animation:cap 10s infinite;opacity:0}
@keyframes cap{0%,18.5%{opacity:1}19.5%,98.5%{opacity:0}100%{opacity:1}}
.d1{animation-delay:0s}.d2{animation-delay:-8s}.d3{animation-delay:-6s}.d4{animation-delay:-4s}.d5{animation-delay:-2s}
.dash{stroke-dasharray:4 5;animation:mv 1.2s linear infinite}
@keyframes mv{to{stroke-dashoffset:-18}}
.bar{transform-box:fill-box;transform-origin:center;animation:bar .9s ease-in-out infinite}
@keyframes bar{50%{transform:scaleY(.3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.cap.d1{opacity:1}}
</style>
